aid: mirantis

name: Mirantis

description: >-
  Mirantis provides enterprise Kubernetes and container platform solutions for multi-cloud,
  hybrid-cloud, and edge deployments. Its product line includes Mirantis Kubernetes
  Engine (MKE), k0rdent Enterprise, Mirantis OpenStack for Kubernetes (MOSK), Mirantis
  Container Runtime, Mirantis Secure Registry, Lens Desktop, and the open source k0s
  Kubernetes distribution and k0smotron orchestrator.

